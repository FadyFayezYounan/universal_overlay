name: universal_overlay_workspace
repository: https://github.com/FadyFayezYounan/universal_overlay

packages:
  - packages/**

command:
  version:
    # Generate commit links in package changelogs.
    linkToCommits: true
    # Only allow versioning to happen on main branch.
    branch: main
    # Additionally build a changelog at the root of the workspace.
    workspaceChangelog: true

  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    run: melos exec -c 1 -- "dart analyze --fatal-infos"
    description: Run `dart analyze` in all packages.

  format:
    run: dart format .
    description: Format all Dart files.

  format:check:
    run: dart format --set-exit-if-changed .
    description: Check formatting of all Dart files.

  test:
    run: melos exec -c 1 -- "flutter test"
    description: Run `flutter test` in all packages.
    packageFilters:
      dirExists: test

  pub:get:
    run: melos exec -- "flutter pub get"
    description: Run `flutter pub get` in all packages.

  clean:
    run: melos exec -- "flutter clean"
    description: Run `flutter clean` in all packages.
